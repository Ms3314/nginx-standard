services:
  nginx:
    image: ${IMAGE:?IMAGE is required}:${TAG:-latest}
    container_name: nginx
    restart: unless-stopped
    environment:
      # Your subdomain, e.g. app.example.com. "_" = match anything (HTTP only).
      DOMAIN: ${DOMAIN:-_}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificates issued by certbot on the VM
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME HTTP-01 challenge files
      - /var/www/certbot:/var/www/certbot:ro
    # Add backend services here for reverse-proxy mode, e.g.:
    # app:
    #   image: your/app:tag
    #   restart: unless-stopped

name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # `docker build` runs `nginx -t`, so a bad config fails here
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.VM_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copy compose file and deploy script
        run: |
          scp -i ~/.ssh/id_deploy -P "${{ secrets.VM_PORT || 22 }}" \
            docker-compose.yml scripts/deploy.sh scripts/issue-cert.sh \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/nginx-base/"

      - name: Pull and restart on the VM
        run: |
          # The short-lived GITHUB_TOKEN lets the VM pull a private GHCR image
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/id_deploy -p "${{ secrets.VM_PORT || 22 }}" \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
             /opt/nginx-base/deploy.sh '${{ needs.build.outputs.image }}' '${{ needs.build.outputs.tag }}' '${{ vars.DOMAIN }}'"

      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 3 "http://${{ secrets.VM_HOST }}/healthz"

# ---------------------------------------------------------------
# Example upstream for the reverse-proxy mode.
# Uncomment and point at your backend (a compose service name,
# or host.docker.internal for an app running on the VM itself).
# ---------------------------------------------------------------
# upstream app_backend {
#     server app:3000;
# }

server {
    listen 80 default_server;
    server_name _;   # replace with your domain once you have one

    # Used by the Docker HEALTHCHECK and the deploy script
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Static site mode (default) ----
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- Reverse proxy mode (example) ----
    # location /api/ {
    #     proxy_pass http://app_backend;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}


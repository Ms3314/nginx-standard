# Shared by every server block on port 80.

# Used by the Docker HEALTHCHECK and the pipeline smoke test
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Let's Encrypt HTTP-01 challenge (certbot runs on the VM, webroot is mounted)
location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}
